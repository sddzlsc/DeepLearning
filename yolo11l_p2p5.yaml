# Punctuation ablation B: preserve the original P3/P4/P5 path and add an
# auxiliary high-resolution P2/4 detection branch. Detect inputs deliberately
# keep P3/P4/P5 first so their pretrained head widths remain compatible.

nc: 3
scale: l
scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]              # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10-P5/32 context

head:
  # Original YOLO11l neck remains byte-for-byte equivalent through layer 22.
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]             # 13-P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]             # 16-P3 output
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]             # 19-P4 output
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 22-P5 output

  # Auxiliary P2 branch for 8-16 px punctuation at imgsz=1280.
  - [16, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]             # 25-P2 output
  - [[16, 19, 22, 25], 1, Detect, [nc]]     # strides 8/16/32/4
